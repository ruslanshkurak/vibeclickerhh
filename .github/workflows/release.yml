name: Build and Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build EXE via build_venv.py
        run: |
          python build_venv.py

      - name: Prepare Release Asset
        shell: powershell
        run: |
          if (Test-Path "dist/gui_app.exe") {
            Copy-Item "dist/gui_app.exe" -Destination "dist/VibeClickerHH.exe"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VibeClickerHH.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
